server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side - any path that isn't a real
    # static file falls back to index.html instead of nginx's own 404, same
    # rewrite Vercel does in vercel.json for production.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
